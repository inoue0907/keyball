<script>
(function () {
  var D = JSON.parse(document.getElementById('kmdata').textContent);
  var LAY = D.layers, GEO = D.geo, cur = 0;
  var JA_RE = /[^\x00-\x7f\n]/;

  var rail = document.getElementById('rail');
  var tabs = LAY.map(function (L, i) {
    var b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = '<span class="n"></span><span></span>';
    b.firstChild.textContent = 'L' + L.id;
    b.lastChild.textContent = L.ja;
    b.onclick = function () { cur = i; paint(); };
    b.onkeydown = function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      cur = (cur + d + LAY.length) % LAY.length;
      paint(); tabs[cur].focus();
    };
    rail.appendChild(b);
    return b;
  });

  document.documentElement.style.setProperty('--cols', D.cols);
  document.documentElement.style.setProperty('--rows', D.rows);

  var comboPos = {};
  (D.combos || []).forEach(function (c) { c.pos.forEach(function (p) { comboPos[p] = 1; }); });

  /* レイヤーごとに盤面を 1 枚ずつ作る。画面では選択中だけ見せ、印刷では全部並べる */
  var holder = document.getElementById('boards');
  var boards = LAY.map(function (L, li) {
    var board = document.createElement('div');
    board.className = 'board';
    var nm = document.createElement('div');
    nm.className = 'lname';
    nm.innerHTML = '<span></span>';
    nm.firstChild.textContent = 'L' + L.id;
    nm.appendChild(document.createTextNode(L.ja));
    board.appendChild(nm);
    var cells = GEO.map(function (g, pos) {
      var k = document.createElement('div');
      k.className = 'key' + (li === 0 && comboPos[pos] ? ' combo' : '');
      k.style.setProperty('--x', g.x);
      k.style.setProperty('--y', g.y);
      k.innerHTML = '<div class="pos"></div>' +
                    '<div class="subrow"><span class="sub"></span></div>' +
                    '<div class="legend"><span class="main"></span></div>';
      k.querySelector('.pos').textContent = pos;
      board.appendChild(k);
      var c = {
        sub: k.querySelector('.sub'),
        subrow: k.querySelector('.subrow'),
        legend: k.querySelector('.legend'),
        main: k.querySelector('.main')
      };
      var key = L.keys[pos];
      k.dataset.cat = key.cat;
      k.title = '位置 ' + pos + '  ' + key.raw;
      c.sub.textContent = key.sub;
      c.subrow.hidden = !key.sub;
      c.main.textContent = key.main;
      c.main.className = 'main' + (JA_RE.test(key.main) ? ' ja' : '');
      return c;
    });
    holder.appendChild(board);
    return { el: board, cells: cells };
  });

  var notes = document.getElementById('notes');
  (D.combos || []).forEach(function (c) {
    var li = document.createElement('li');
    li.innerHTML = '<b></b>';
    li.firstChild.textContent = c.out;
    li.appendChild(document.createTextNode(' … ' + c.keys.join(' + ') +
      ' を同時押し（ベースで下線のキー）'));
    notes.appendChild(li);
  });

  /* legends never wrap (white-space: pre); anything still too big is
     scaled down uniformly so it can't spill over or collide */
  function fit(span, box) {
    span.style.transform = '';
    var w = span.offsetWidth, h = span.offsetHeight;
    if (!w || !h) return;
    var s = Math.min(1, (box.clientWidth - 1) / w, (box.clientHeight - 1) / h);
    if (s < 0.995) span.style.transform = 'scale(' + Math.max(s, 0.45).toFixed(3) + ')';
  }

  function paint() {
    tabs.forEach(function (t, i) {
      t.setAttribute('aria-selected', i === cur ? 'true' : 'false');
      t.tabIndex = i === cur ? 0 : -1;
    });
    boards.forEach(function (b, i) { b.el.hidden = i !== cur; });
    refit();
  }

  /* 見えている盤面だけ測れる（hidden だと幅 0） */
  function refit() {
    boards.forEach(function (b) {
      if (b.el.hidden) return;
      b.cells.forEach(function (c) {
        if (!c.subrow.hidden) fit(c.sub, c.subrow);
        fit(c.main, c.legend);
      });
    });
  }

  function printing(on) {
    document.body.classList.toggle('printing', on);
    if (!on) return paint();
    boards.forEach(function (b) { b.el.hidden = false; });
    refit();
  }
  addEventListener('beforeprint', function () { printing(true); });
  addEventListener('afterprint', function () { printing(false); });

  var t;
  addEventListener('resize', function () { clearTimeout(t); t = setTimeout(refit, 120); });
  paint();
  /* ?print は PDF 生成用: 最初から全レイヤーを印刷の並びで出す */
  if (/[?&]print\b/.test(location.search)) printing(true);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
})();
</script>
